<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>영단어 마스터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',sans-serif;background:#fff9f0;min-height:100vh;overflow-x:hidden;}

.screen{display:none;padding:16px;max-width:560px;margin:0 auto;}
.screen.active{display:block;}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 28px;border:none;border-radius:50px;font-size:1rem;cursor:pointer;font-weight:bold;touch-action:manipulation;transition:transform .1s;}
.btn:active{transform:scale(.94);}
.btn-primary{background:#ff6b6b;color:#fff;box-shadow:0 4px 0 #c94e4e;}
.btn-primary:active{box-shadow:none;transform:translateY(3px);}
.btn-green{background:#4ecb71;color:#fff;box-shadow:0 4px 0 #2fa04d;}
.btn-green:active{box-shadow:none;transform:translateY(3px);}
.btn-blue{background:#4ea8de;color:#fff;box-shadow:0 4px 0 #2a7ab5;}
.btn-blue:active{box-shadow:none;transform:translateY(3px);}
.btn-orange{background:#ffaa33;color:#fff;box-shadow:0 4px 0 #cc7a00;}
.btn-orange:active{box-shadow:none;transform:translateY(3px);}
.btn-gray{background:#e8e8e8;color:#555;box-shadow:0 3px 0 #bbb;}
.btn-gray:active{box-shadow:none;transform:translateY(3px);}
.center{text-align:center;}

/* ── 홈 ── */
#home{padding-bottom:30px;}
.mascot-anim{font-size:5rem;text-align:center;margin:16px 0;animation:bounce 2s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
#home h1{text-align:center;color:#ff6b6b;font-size:2.2rem;}
.subtitle{text-align:center;color:#aaa;margin:4px 0 18px;font-size:.93rem;}
.lesson-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.lesson-card{background:#fff;border-radius:16px;padding:13px 6px;text-align:center;cursor:pointer;
  border:3px solid #ffe0b2;box-shadow:0 3px 0 #ffe0b2;transition:transform .15s,border-color .15s;
  touch-action:manipulation;}
.lesson-card:active{transform:scale(.94);}
.lesson-card:hover{border-color:#ff6b6b;}
.lesson-card .lnum{font-size:1.35rem;font-weight:bold;color:#ff6b6b;}
.lesson-card .lname{font-size:.68rem;color:#999;margin-top:3px;line-height:1.3;}
.lesson-card .stars{color:#ffd700;font-size:.85rem;margin-top:3px;}
.retry-wrap{text-align:center;margin-top:6px;}
.retry-badge{background:#ff6b6b;color:#fff;border-radius:50%;width:22px;height:22px;
  display:inline-flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:bold;margin-left:6px;}

/* ── 모드 선택 ── */
.mode-cards{display:flex;flex-direction:column;gap:12px;margin:16px 0;}
.mode-card{background:#fff;border-radius:16px;padding:16px 18px;cursor:pointer;
  border:3px solid #e0e0e0;display:flex;align-items:center;gap:14px;
  touch-action:manipulation;transition:border-color .15s,transform .1s;}
.mode-card:active{transform:scale(.97);}
.mode-card:hover{border-color:#ff6b6b;}
.mode-card .icon{font-size:2rem;}
.mode-card .info .mtitle{font-weight:bold;font-size:1rem;color:#333;}
.mode-card .info .mdesc{font-size:.82rem;color:#999;margin-top:3px;}

/* ── 게임 ── */
.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.progress-wrap{flex:1;margin:0 10px;background:#eee;border-radius:20px;height:12px;overflow:hidden;}
.progress-bar{height:12px;border-radius:20px;background:linear-gradient(90deg,#ff6b6b,#ffaa33);transition:width .5s;}
.score-badge{background:#fff;border:2px solid #ffd700;border-radius:20px;padding:4px 12px;
  font-weight:bold;color:#f59e0b;font-size:.9rem;white-space:nowrap;}
.q-counter{text-align:center;color:#aaa;font-size:.83rem;margin-bottom:8px;}

.question-box{background:#fff;border-radius:20px;padding:24px 18px;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:16px;
  animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.q-label{color:#aaa;font-size:.83rem;margin-bottom:6px;}
.q-word{font-size:1.9rem;font-weight:bold;color:#333;word-break:break-all;}
.q-hint{font-size:.88rem;color:#bbb;margin-top:5px;}

.feedback{text-align:center;font-size:1.25rem;font-weight:bold;min-height:34px;margin-bottom:8px;
  transition:opacity .2s;}
.feedback.correct{color:#4ecb71;}
.feedback.wrong{color:#ff6b6b;}

/* 정답 폭죽 */
.confetti-wrap{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;
  animation:confettiFall 1.2s ease-in forwards;}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}

/* 흔들기 (오답) */
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
.shake{animation:shake .4s ease;}

/* 모드1 */
.choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{background:#fff;border:2px solid #e0e0e0;border-radius:14px;
  padding:15px 16px;font-size:1rem;cursor:pointer;text-align:left;
  touch-action:manipulation;transition:border-color .15s,background .15s;
  -webkit-user-select:none;user-select:none;}
.choice-btn:active:not(:disabled){transform:scale(.97);}
.choice-btn.correct{border-color:#4ecb71;background:#f0fff4;color:#2f9e55;}
.choice-btn.wrong{border-color:#ff6b6b;background:#fff0f0;color:#cc3333;}

/* 모드2 */
.letter-area{min-height:58px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:12px;}
.letter-slot{min-width:42px;height:52px;padding:0 4px;border-bottom:3px solid #ccc;
  display:flex;align-items:center;justify-content:center;font-size:1.45rem;font-weight:bold;
  color:#333;cursor:pointer;border-radius:8px 8px 0 0;transition:background .12s;}
.letter-slot.filled{background:#fff8e7;border-bottom-color:#ffaa33;}
.letter-slot.correct-slot{background:#f0fff4;border-bottom-color:#4ecb71;}
.letter-slot.wrong-slot{background:#fff0f0;border-bottom-color:#ff6b6b;}
.tile-area{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;}
.tile{min-width:44px;height:52px;padding:0 6px;background:#ffaa33;color:#fff;
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:1.45rem;font-weight:bold;cursor:pointer;touch-action:manipulation;
  box-shadow:0 3px 0 #cc7a00;transition:transform .1s,opacity .15s;
  -webkit-user-select:none;user-select:none;}
.tile:active{transform:scale(.9);box-shadow:none;}
.tile.used{opacity:0;pointer-events:none;}

/* 모드3 */
.writing-input{width:100%;font-size:1.5rem;padding:14px 16px;border:3px solid #ddd;
  border-radius:14px;outline:none;text-align:center;letter-spacing:3px;
  transition:border-color .2s;-webkit-appearance:none;}
.writing-input:focus{border-color:#4ea8de;}
.writing-input.correct{border-color:#4ecb71;background:#f0fff4;}
.writing-input.wrong{border-color:#ff6b6b;background:#fff0f0;}
.char-hint{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.char-box{min-width:32px;height:38px;border-bottom:3px solid #ddd;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:bold;color:#333;}

/* ── 결과 ── */
#result{text-align:center;padding-bottom:30px;}
.result-mascot{font-size:5rem;margin:16px 0;animation:bounce 2s infinite;}
.result-score{font-size:2.2rem;font-weight:bold;color:#ff6b6b;margin:8px 0;}
.star-row{font-size:2.3rem;margin:8px 0;}
.wrong-list{background:#fff;border-radius:16px;padding:14px 16px;margin:14px 0;text-align:left;}
.wrong-list h3{color:#ff6b6b;margin-bottom:10px;}
.wrong-item{padding:7px 0;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;}
.wrong-item .wword{font-weight:bold;color:#333;min-width:90px;font-size:1rem;}
.wrong-item .wmean{color:#888;font-size:.92rem;}
.result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}

/* ── 단어장 화면 ── */
#wordbook{padding-bottom:30px;}
#wordbook h2{color:#ff6b6b;text-align:center;margin:10px 0 4px;}
.wb-subtitle{text-align:center;color:#aaa;font-size:.85rem;margin-bottom:14px;}
.wb-filter{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
.wb-filter .fbtn{padding:7px 16px;border-radius:50px;border:2px solid #ddd;background:#fff;
  font-size:.85rem;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s;}
.wb-filter .fbtn.active{border-color:#ff6b6b;background:#fff5f5;color:#ff6b6b;font-weight:bold;}
.wb-list{display:flex;flex-direction:column;gap:8px;}
.wb-card{background:#fff;border-radius:14px;padding:13px 16px;display:flex;
  align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.wb-card .wb-en{font-size:1.1rem;font-weight:bold;color:#333;}
.wb-card .wb-ko{color:#888;font-size:.92rem;}
.wb-card .wb-badge{background:#ff6b6b;color:#fff;border-radius:20px;padding:2px 9px;font-size:.75rem;font-weight:bold;}
.wb-empty{text-align:center;color:#bbb;padding:30px 0;font-size:1rem;}

/* ── 홈 하단 버튼 ── */
.home-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;}

@media(max-width:380px){
  .lesson-grid{grid-template-columns:repeat(2,1fr);}
  .q-word{font-size:1.5rem;}
  .tile{min-width:38px;height:46px;font-size:1.25rem;}
  .letter-slot{min-width:36px;height:46px;font-size:1.25rem;}
}
</style>
</head>
<body>

<!-- ══ 홈 ══ -->
<div id="home" class="screen active">
  <div class="mascot-anim">🦊</div>
  <h1>영단어 마스터!</h1>
  <p class="subtitle">레슨을 선택해서 시작하세요 ✨</p>
  <div class="lesson-grid" id="lessonGrid"></div>
  <div class="home-actions">
    <div class="retry-wrap" id="retryWrap" style="display:none">
      <button class="btn btn-primary" onclick="startRetry()">
        ❌ 틀린 단어 도전 <span class="retry-badge" id="retryCount">0</span>
      </button>
    </div>
    <button class="btn btn-blue" onclick="showWordbook()">📖 단어장</button>
  </div>
</div>

<!-- ══ 모드 선택 ══ -->
<div id="mode-select" class="screen">
  <div class="game-header">
    <button class="btn btn-gray" onclick="goHome()">← 홈</button>
    <h2 id="modeLessonTitle" style="color:#ff6b6b;font-size:1rem;text-align:center;flex:1;padding:0 8px;"></h2>
    <div style="width:60px"></div>
  </div>
  <div class="mode-cards">
    <div class="mode-card" onclick="startGame(1)">
      <div class="icon">🔤</div>
      <div class="info"><div class="mtitle">뜻 맞추기</div><div class="mdesc">영어 단어를 보고 한글 뜻을 골라요</div></div>
    </div>
    <div class="mode-card" onclick="startGame(2)">
      <div class="icon">🔀</div>
      <div class="info"><div class="mtitle">철자 순서 맞추기</div><div class="mdesc">뒤섞인 알파벳을 올바른 순서로 배열해요</div></div>
    </div>
    <div class="mode-card" onclick="startGame(3)">
      <div class="icon">✏️</div>
      <div class="info"><div class="mtitle">단어 쓰기</div><div class="mdesc">한글 뜻을 보고 영어 단어를 직접 입력해요</div></div>
    </div>
  </div>
</div>

<!-- ══ 게임 ══ -->
<div id="game" class="screen">
  <div class="game-header">
    <button class="btn btn-gray" style="font-size:.82rem;padding:9px 14px" onclick="goHome()">← 홈</button>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="score-badge">⭐ <span id="scoreDisplay">0</span></div>
  </div>
  <div class="q-counter" id="qCounter"></div>
  <div class="question-box" id="questionBox">
    <div class="q-label" id="qLabel"></div>
    <div class="q-word" id="qWord"></div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div class="feedback" id="feedback"></div>

  <div id="m1area" style="display:none"><div class="choices" id="choicesArea"></div></div>

  <div id="m2area" style="display:none">
    <div class="letter-area" id="slotArea"></div>
    <div class="tile-area" id="tileArea"></div>
    <div class="center"><button class="btn btn-gray" style="font-size:.85rem;padding:9px 18px" onclick="clearSlots()">↩ 다시</button></div>
  </div>

  <div id="m3area" style="display:none">
    <div style="color:#aaa;font-size:.88rem;text-align:center;margin-bottom:10px" id="writingHint"></div>
    <input class="writing-input" id="writingInput" type="text" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="여기에 입력하세요"
           oninput="onWritingInput()" onkeydown="if(event.key==='Enter')checkWriting()">
    <div class="char-hint" id="charHint"></div>
    <div class="center" style="margin-top:14px">
      <button class="btn btn-blue" onclick="checkWriting()">확인 ✔</button>
    </div>
  </div>

  <div class="center" style="margin-top:12px">
    <button class="btn btn-green" id="nextBtn" style="display:none" onclick="nextQuestion()">다음 →</button>
  </div>
</div>

<!-- ══ 결과 ══ -->
<div id="result" class="screen">
  <div class="result-mascot" id="resultMascot"></div>
  <h2 id="resultTitle" style="font-size:1.6rem;"></h2>
  <div class="result-score" id="resultScore"></div>
  <div class="star-row" id="starRow"></div>
  <div class="wrong-list" id="wrongList" style="display:none">
    <h3>❌ 틀린 단어</h3>
    <div id="wrongItems"></div>
  </div>
  <div class="result-btns">
    <button class="btn btn-orange" onclick="retryWrong()" id="retryWrongBtn" style="display:none">틀린 단어 다시!</button>
    <button class="btn btn-green"  onclick="goModeSelect()">다른 모드</button>
    <button class="btn btn-gray"   onclick="goHome()">홈으로</button>
  </div>
</div>

<!-- ══ 단어장 ══ -->
<div id="wordbook" class="screen">
  <div class="game-header">
    <button class="btn btn-gray" onclick="goHome()">← 홈</button>
    <h2 style="flex:1;text-align:center;color:#ff6b6b;font-size:1.1rem;">📖 단어장</h2>
    <div style="width:60px"></div>
  </div>
  <div class="wb-filter" id="wbFilter"></div>
  <div class="wb-list" id="wbList"></div>
</div>

<!-- 효과음 (Web Audio) -->
<script>
const AC = new (window.AudioContext||window.webkitAudioContext)();

function playSound(type){
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    if(type==='correct'){
      o.frequency.setValueAtTime(520,AC.currentTime);
      o.frequency.setValueAtTime(660,AC.currentTime+.08);
      o.frequency.setValueAtTime(800,AC.currentTime+.16);
      g.gain.setValueAtTime(.18,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.45);
      o.start(); o.stop(AC.currentTime+.45);
    } else {
      o.frequency.setValueAtTime(280,AC.currentTime);
      o.frequency.setValueAtTime(220,AC.currentTime+.1);
      g.gain.setValueAtTime(.15,AC.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);
      o.start(); o.stop(AC.currentTime+.35);
    }
  }catch(e){}
}

function spawnConfetti(){
  const wrap=document.createElement('div');
  wrap.className='confetti-wrap';
  document.body.appendChild(wrap);
  const colors=['#ff6b6b','#4ecb71','#4ea8de','#ffaa33','#c084fc','#ffd700'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.top='-10px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=Math.random()*.6+'s';
    p.style.animationDuration=(.8+Math.random()*.7)+'s';
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    wrap.appendChild(p);
  }
  setTimeout(()=>wrap.remove(),1800);
}

// ══════════ 상태 ══════════
let currentLesson=null, currentMode=0;
let queue=[], qIdx=0, score=0;
let wrongWords=[];       // 세션 틀린 단어
let globalWrong=loadGlobalWrong(); // 누적 틀린 단어 (영구저장)
let isRetryMode=false;
let m2slots=[], m2tiles=[];

function loadGlobalWrong(){
  try{ return JSON.parse(localStorage.getItem('globalWrong')||'[]'); }catch(e){ return []; }
}
function saveGlobalWrong(){
  try{ localStorage.setItem('globalWrong', JSON.stringify(globalWrong)); }catch(e){}
}
function addGlobalWrong(w){
  if(!globalWrong.find(x=>x.en===w.en)) globalWrong.push(w);
  saveGlobalWrong();
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function allWords(){ return LESSONS.flatMap(l=>l.words); }
function getWords(lid){
  if(lid==='retry') return globalWrong;
  return LESSONS.find(l=>l.id===lid).words;
}

// ══════════ 홈 ══════════
function renderHome(){
  const grid=document.getElementById('lessonGrid');
  grid.innerHTML='';
  LESSONS.forEach(l=>{
    const card=document.createElement('div');
    card.className='lesson-card';
    card.innerHTML=`<div class="lnum">L${l.id}</div><div class="lname">${l.name}</div><div class="stars">${getStars(l.id)}</div>`;
    card.onclick=()=>selectLesson(l.id);
    grid.appendChild(card);
  });
  const wrap=document.getElementById('retryWrap');
  document.getElementById('retryCount').textContent=globalWrong.length;
  wrap.style.display=globalWrong.length>0?'block':'none';
}

function getStars(id){
  const s=parseInt(localStorage.getItem('star_'+id)||'0');
  return '★'.repeat(s)+'☆'.repeat(3-s);
}
function saveStars(id,n){
  const p=parseInt(localStorage.getItem('star_'+id)||'0');
  if(n>p) localStorage.setItem('star_'+id,n);
}

function goHome(){ show('home'); renderHome(); }
function selectLesson(id){
  currentLesson=id; isRetryMode=false;
  document.getElementById('modeLessonTitle').textContent='L'+id+'. '+LESSONS.find(l=>l.id===id).name;
  show('mode-select');
}
function startRetry(){
  currentLesson='retry'; isRetryMode=true;
  document.getElementById('modeLessonTitle').textContent='❌ 틀린 단어 도전';
  show('mode-select');
}
function goModeSelect(){ show('mode-select'); }

// ══════════ 단어장 ══════════
let wbFilter='wrong';
function showWordbook(){
  wbFilter='wrong';
  renderWordbook();
  show('wordbook');
}
function renderWordbook(){
  const filterEl=document.getElementById('wbFilter');
  const listEl=document.getElementById('wbList');
  const filters=[
    {key:'wrong',label:'❌ 틀린 단어'},
    {key:'all',label:'📚 전체 단어'},
    ...LESSONS.map(l=>({key:'l'+l.id,label:'L'+l.id}))
  ];
  filterEl.innerHTML='';
  filters.forEach(f=>{
    const btn=document.createElement('button');
    btn.className='fbtn'+(wbFilter===f.key?' active':'');
    btn.textContent=f.label;
    btn.onclick=()=>{ wbFilter=f.key; renderWordbook(); };
    filterEl.appendChild(btn);
  });

  let words=[];
  if(wbFilter==='wrong') words=globalWrong;
  else if(wbFilter==='all') words=allWords();
  else {
    const id=parseInt(wbFilter.replace('l',''));
    words=LESSONS.find(l=>l.id===id)?.words||[];
  }

  // 중복 제거
  const seen=new Set();
  words=words.filter(w=>{ if(seen.has(w.en)) return false; seen.add(w.en); return true; });

  listEl.innerHTML='';
  if(words.length===0){
    listEl.innerHTML=`<div class="wb-empty">${wbFilter==='wrong'?'아직 틀린 단어가 없어요 🎉':'단어가 없어요.'}</div>`;
    return;
  }
  words.forEach(w=>{
    const card=document.createElement('div');
    card.className='wb-card';
    const isWrong=globalWrong.find(x=>x.en===w.en);
    card.innerHTML=`
      <div>
        <div class="wb-en">${w.en}</div>
        <div class="wb-ko">${w.ko}</div>
      </div>
      ${isWrong?'<span class="wb-badge">틀림</span>':''}
    `;
    listEl.appendChild(card);
  });
}

// ══════════ 게임 시작 ══════════
function startGame(mode){
  currentMode=mode;
  const words=getWords(currentLesson);
  queue=shuffle(words).slice(0,Math.min(words.length,10));
  qIdx=0; score=0; wrongWords=[];
  show('game');
  renderQuestion();
}

function renderQuestion(){
  const w=queue[qIdx];
  document.getElementById('qCounter').textContent=`${qIdx+1} / ${queue.length}`;
  document.getElementById('progressBar').style.width=`${(qIdx/queue.length)*100}%`;
  document.getElementById('scoreDisplay').textContent=score;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').style.display='none';
  const input=document.getElementById('writingInput');
  if(input){ input.value=''; input.className='writing-input'; input.disabled=false; }

  // 박스 애니메이션 재시작
  const box=document.getElementById('questionBox');
  box.style.animation='none'; box.offsetHeight; box.style.animation='fadeUp .3s ease';

  ['m1area','m2area','m3area'].forEach(id=>document.getElementById(id).style.display='none');

  if(currentMode===1){
    document.getElementById('qLabel').textContent='이 단어의 뜻은?';
    document.getElementById('qWord').textContent=w.en;
    document.getElementById('qHint').textContent='';
    renderMode1(w);
  } else if(currentMode===2){
    document.getElementById('qLabel').textContent='철자를 순서대로 맞춰보세요!';
    document.getElementById('qWord').textContent=w.ko;
    document.getElementById('qHint').textContent=`글자 수: ${w.en.length}개`;
    renderMode2(w);
  } else {
    document.getElementById('qLabel').textContent='영어로 써보세요!';
    document.getElementById('qWord').textContent=w.ko;
    document.getElementById('qHint').textContent=`힌트: ${w.en.length}글자`;
    renderMode3(w);
  }
}

// ── 모드1 ──
function renderMode1(w){
  document.getElementById('m1area').style.display='block';
  const pool=allWords().filter(x=>x.ko!==w.ko);
  const opts=shuffle([w.ko,...shuffle(pool).slice(0,3).map(x=>x.ko)]);
  const area=document.getElementById('choicesArea');
  area.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice-btn'; btn.textContent=opt;
    btn.onclick=()=>checkM1(btn,opt,w.ko,area);
    area.appendChild(btn);
  });
}
function checkM1(btn,chosen,correct,area){
  [...area.querySelectorAll('.choice-btn')].forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('correct');
    setFeedback(true); score+=10;
  } else {
    btn.classList.add('wrong');
    [...area.querySelectorAll('.choice-btn')].forEach(b=>{ if(b.textContent===correct) b.classList.add('correct'); });
    setFeedback(false);
    addWrong(queue[qIdx]);
  }
  document.getElementById('nextBtn').style.display='inline-flex';
}

// ── 모드2 ──
function renderMode2(w){
  document.getElementById('m2area').style.display='block';
  const letters=w.en.toUpperCase().split('');
  m2slots=new Array(letters.length).fill(null);
  // 섞되 원래 순서와 다르게
  let shuffled=shuffle(letters);
  while(letters.length>1 && shuffled.join('')===letters.join('')) shuffled=shuffle(letters);
  m2tiles=[...shuffled];
  renderSlots(w); renderTiles(w);
}
function renderSlots(w){
  const area=document.getElementById('slotArea'); area.innerHTML='';
  m2slots.forEach((ch,i)=>{
    const s=document.createElement('div');
    s.className='letter-slot'+(ch?' filled':'');
    s.textContent=ch||'';
    s.dataset.idx=i;
    s.onclick=()=>removeFromSlot(i,w);
    area.appendChild(s);
  });
}
function renderTiles(w){
  const area=document.getElementById('tileArea'); area.innerHTML='';
  m2tiles.forEach((ch,i)=>{
    const t=document.createElement('div');
    t.className='tile'+(ch===null?' used':'');
    t.textContent=ch||'';
    t.dataset.idx=i;
    t.onclick=()=>addToSlot(i,w);
    area.appendChild(t);
  });
}
function addToSlot(ti,w){
  if(m2tiles[ti]===null) return;
  const e=m2slots.indexOf(null); if(e===-1) return;
  m2slots[e]=m2tiles[ti]; m2tiles[ti]=null;
  renderSlots(w); renderTiles(w);
  if(!m2slots.includes(null)) checkM2(w);
}
function removeFromSlot(si,w){
  if(m2slots[si]===null) return;
  const e=m2tiles.indexOf(null);
  if(e!==-1) m2tiles[e]=m2slots[si]; else m2tiles.push(m2slots[si]);
  m2slots[si]=null;
  renderSlots(w); renderTiles(w);
}
function clearSlots(){
  const w=queue[qIdx];
  m2slots.forEach((ch,i)=>{ if(ch!==null){ const e=m2tiles.indexOf(null); if(e!==-1) m2tiles[e]=ch; else m2tiles.push(ch); m2slots[i]=null; } });
  renderSlots(w); renderTiles(w);
}
function checkM2(w){
  const ans=m2slots.join(''), correct=w.en.toUpperCase();
  const slots=document.getElementById('slotArea').querySelectorAll('.letter-slot');
  if(ans===correct){
    slots.forEach(s=>s.classList.add('correct-slot'));
    setFeedback(true); score+=10;
  } else {
    slots.forEach(s=>s.classList.add('wrong-slot'));
    setFeedback(false); addWrong(w);
    setTimeout(()=>{
      [...document.getElementById('slotArea').querySelectorAll('.letter-slot')]
        .forEach((s,i)=>{ s.textContent=correct[i]; s.classList.remove('wrong-slot'); s.classList.add('correct-slot'); });
    },600);
  }
  document.getElementById('tileArea').querySelectorAll('.tile').forEach(t=>t.style.pointerEvents='none');
  document.getElementById('nextBtn').style.display='inline-flex';
}

// ── 모드3 ──
function renderMode3(w){
  document.getElementById('m3area').style.display='block';
  document.getElementById('writingHint').textContent='';
  renderCharHint(w,'');
  setTimeout(()=>document.getElementById('writingInput').focus(),150);
}
function onWritingInput(){
  const w=queue[qIdx];
  renderCharHint(w,document.getElementById('writingInput').value);
}
function renderCharHint(w,val){
  const area=document.getElementById('charHint'); area.innerHTML='';
  w.en.split('').forEach((_,i)=>{
    const box=document.createElement('div');
    box.className='char-box';
    box.textContent=val[i]||'_';
    area.appendChild(box);
  });
}
function checkWriting(){
  const w=queue[qIdx];
  const val=document.getElementById('writingInput').value.trim().toLowerCase();
  const input=document.getElementById('writingInput');
  if(!val) return;
  input.disabled=true;
  if(val===w.en.toLowerCase()){
    input.classList.add('correct');
    setFeedback(true); score+=10;
  } else {
    input.classList.add('wrong');
    document.getElementById('writingHint').textContent='정답: '+w.en;
    setFeedback(false); addWrong(w);
  }
  document.getElementById('nextBtn').style.display='inline-flex';
}

// ══════════ 공통 ══════════
function setFeedback(correct){
  if(AC.state==='suspended') AC.resume();
  const el=document.getElementById('feedback');
  if(correct){
    const msgs=['정답! 🎉','완벽해요! ⭐','훌륭해요! 🌟','맞았어요! 🎊','대단해요! 🔥'];
    el.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    el.className='feedback correct';
    playSound('correct');
    spawnConfetti();
  } else {
    const msgs=['아쉬워요 😢','다시 도전! 💪','조금만 더! 🔥'];
    el.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    el.className='feedback wrong';
    playSound('wrong');
    const box=document.getElementById('questionBox');
    box.classList.remove('shake'); box.offsetHeight; box.classList.add('shake');
    setTimeout(()=>box.classList.remove('shake'),400);
  }
  document.getElementById('scoreDisplay').textContent=score;
}
function addWrong(w){
  wrongWords.push(w);
  addGlobalWrong(w);
}
function nextQuestion(){
  qIdx++;
  if(qIdx>=queue.length) showResult();
  else renderQuestion();
}

// ══════════ 결과 ══════════
function showResult(){
  show('result');
  const total=queue.length*10, pct=score/total;
  let mascot,title,stars;
  if(pct>=.9){mascot='🏆';title='완벽해요!';stars=3;}
  else if(pct>=.6){mascot='😊';title='잘했어요!';stars=2;}
  else{mascot='😅';title='다시 도전해봐요!';stars=1;}

  if(!isRetryMode) saveStars(currentLesson,stars);

  document.getElementById('resultMascot').textContent=mascot;
  document.getElementById('resultTitle').textContent=title;
  document.getElementById('resultScore').textContent=`${score} / ${total} 점`;
  document.getElementById('starRow').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);

  const wrongBtn=document.getElementById('retryWrongBtn');
  if(wrongWords.length>0){
    wrongBtn.style.display='inline-flex';
    const wList=document.getElementById('wrongList');
    wList.style.display='block';
    const items=document.getElementById('wrongItems');
    items.innerHTML='';
    [...new Map(wrongWords.map(w=>[w.en,w])).values()].forEach(w=>{
      const d=document.createElement('div');
      d.className='wrong-item';
      d.innerHTML=`<span class="wword">${w.en}</span><span class="wmean">${w.ko}</span>`;
      items.appendChild(d);
    });
  } else {
    wrongBtn.style.display='none';
    document.getElementById('wrongList').style.display='none';
  }
}

function retryWrong(){
  queue=shuffle([...new Map(wrongWords.map(w=>[w.en,w])).values()]);
  qIdx=0; score=0; wrongWords=[];
  show('game'); renderQuestion();
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
